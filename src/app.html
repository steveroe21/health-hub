<!DOCTYPE html>
<html lang="en">

<title>Health Hub</title>
<style>
/*%%FONTFACE%%*/
:root{
  color-scheme: dark;
  /* brand board: Egyptian Blue #0F2D52 · Stone Blue #7A8CA3 · Scarlet Red #C6283D */
  --brand:#0F2D52;
  --stone:#7A8CA3;
  --scarlet:#C6283D;
  --dot:#E0354B;
  --bg:#0B1E36;
  --surface:#132C4C;
  --surface-2:#1A3760;
  --surface-3:#244573;
  --line:rgba(122,140,163,.24);
  --text:#ECE7E1;
  --text-2:#C3CBD6;
  --muted:#93A4BA;
  --accent:#C6283D;
  --accent-ink:#FFFFFF;
  --link:#FF6B7E;
  --accent-soft:rgba(198,40,61,.20);
  --data:#5E8FD0;
  --goal:#F0566A;
  --grid:rgba(122,140,163,.18);
  --good:#2FBF71;  --good-ink:#86E0AE;  --good-bg:rgba(47,191,113,.16);
  --warn:#E9A83A;  --warn-ink:#F4C677;  --warn-bg:rgba(233,168,58,.16);
  --bad:#C6283D;   --bad-ink:#FF8796;   --bad-bg:rgba(198,40,61,.22);
  --radius:16px;
  --font:"Inter Variable", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --display:"Archivo Variable", Archivo, "Arial Black", -apple-system, sans-serif;
  --tabbar-h:62px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{overflow:hidden;overscroll-behavior:none}
/* No zoom and no sideways scrolling: double-tap and pinch zoom are off everywhere, and every scrolling area only moves up and down */
html,body{touch-action:manipulation;overflow-x:hidden;max-width:100%}
#scroll,.sheet,.wk-body,.pk-list,.auth,.preview{overflow-x:hidden;touch-action:pan-y}
/* App frame: header and tab bar stay put, only #scroll moves (the whole page never scrolls, so iOS can't shift the bars) */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
#scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-bottom:16px}
button{font:inherit;color:inherit;cursor:pointer}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.topbar{position:relative;flex:none;z-index:20;background:rgba(15,45,82,.92);-webkit-backdrop-filter:saturate(1.3) blur(16px);backdrop-filter:saturate(1.3) blur(16px);padding:calc(env(safe-area-inset-top) + 8px) max(16px, env(safe-area-inset-right)) 8px max(18px, env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);min-height:56px}
.brand{font-family:var(--display);font-weight:800;font-stretch:125%;font-size:21px;letter-spacing:-.035em;line-height:1;color:var(--text);white-space:nowrap}
.dot{display:inline-block;width:.2em;height:.2em;border-radius:50%;background:var(--dot);margin-left:.05em;color:transparent;overflow:hidden;line-height:0;vertical-align:baseline;flex:none}
.page-head{max-width:760px;margin:0 auto;padding:18px max(18px, env(safe-area-inset-right)) 4px max(18px, env(safe-area-inset-left))}
.page-head h1{font-family:var(--display);font-weight:800;font-stretch:125%;font-size:clamp(23px, 7.2vw, 32px);line-height:1.08;letter-spacing:-.03em;margin:0;overflow-wrap:anywhere}
.page-head .sub{font-size:12.5px;color:var(--muted);margin-top:7px;display:flex;align-items:center;gap:6px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.sync-dot.ok{background:var(--good)} .sync-dot.busy{background:var(--warn)} .sync-dot.err{background:var(--dot)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.06);display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn svg{width:21px;height:21px}

main{padding:12px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left));max-width:760px;margin:0 auto}

/* ---------- cards & text ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card.link{transition:transform .12s}
.card.link{display:block;width:100%;text-align:left;cursor:pointer}
.card.link:active{transform:scale(.99)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row.top{align-items:flex-start}
.label{font-size:11.5px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
.big{font-family:var(--display);font-stretch:118%;font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.big small{font-family:var(--font);font-stretch:100%;font-size:16px;font-weight:600;color:var(--text-2);margin-left:4px;letter-spacing:0}
.med{font-family:var(--display);font-stretch:115%;font-size:20px;font-weight:750;letter-spacing:-.02em}
.muted{color:var(--muted)}
.text-2{color:var(--text-2)}
.small{font-size:13px}
.sm-gap{margin-top:6px}
.md-gap{margin-top:12px}
.section-title{font-family:var(--display);font-stretch:118%;font-size:18px;font-weight:800;margin:24px 2px 10px;letter-spacing:-.02em}
.hello{margin:4px 2px 14px}
.hello .d{font-size:15px;color:var(--text-2)}
.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:14px;padding:10px 14px;font-size:14px;margin-bottom:12px}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:650;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--text-2);white-space:nowrap;flex:none}
.chip.good{background:var(--good-bg);color:var(--good-ink)}
.chip.warn{background:var(--warn-bg);color:var(--warn-ink)}
.chip.bad{background:var(--bad-bg);color:var(--bad-ink)}

/* ---------- progress ---------- */
.prog{position:relative;height:10px;border-radius:99px;background:var(--surface-3);margin-top:12px}
.prog > i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--data);max-width:100%}
.prog > b{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:2px;background:var(--text)}

/* ---------- stats grid ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media (min-width:560px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat .k{font-size:12.5px;color:var(--muted);font-weight:600}
.stat .v{font-size:19px;font-weight:750;margin-top:4px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted);margin-top:2px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:650;font-size:16px;border-radius:12px;padding:13px 16px;border:0;background:var(--surface-2);color:var(--text);text-decoration:none;min-height:48px}
.btn:active{opacity:.8}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--link);padding:8px 4px;min-height:0;font-size:15px}
.btn.danger{color:var(--bad-ink)}
.btn.small{font-size:14px;padding:8px 12px;border-radius:11px;min-height:36px}
.btn svg{width:18px;height:18px}
.btn-row{display:flex;gap:10px;margin-bottom:12px}
.btn-row .btn{flex:1}
.hero-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--scarlet);color:#fff;border:0;border-radius:14px;padding:18px 18px;margin:4px 0 10px;box-shadow:0 10px 26px rgba(198,40,61,.22)}
.hero-card:active,.qt:active{transform:scale(.985)}
.hero-card .hc-ic{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;flex:none}
.hero-card .hc-ic svg{width:26px;height:26px}
.hero-card .hc-t{flex:1;min-width:0;display:flex;flex-direction:column}
.hero-card .t{font-family:var(--display);font-stretch:118%;font-weight:800;font-size:19px;letter-spacing:-.02em}
.hero-card .s{font-size:13.5px;opacity:.85;margin-top:3px}
.arr{width:22px;height:22px;flex:none;opacity:.9}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.qt{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 12px;color:var(--text);font-weight:650;font-size:14.5px;min-height:52px;position:relative}
.qt svg{width:20px;height:20px;color:var(--stone);flex:none}
.qt span{flex:1;text-align:left}
.qt b{color:var(--link);font-size:18px;font-weight:600;line-height:1}
@media (max-width:360px){.qt b{display:none}.qt{padding:12px 10px;font-size:13.5px}}

/* ---------- segmented ---------- */
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px;margin:14px 0 6px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px 4px;font-size:13px;font-weight:650;color:var(--text-2)}
.seg button.on{background:var(--surface-3);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.35)}

/* ---------- chart ---------- */
.chart{position:relative;width:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{display:block;width:100%;overflow:visible}
.chart .empty{height:200px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:14px;padding:0 20px}
.chart text{font-family:var(--font);font-size:11px;fill:var(--muted)}
.tip{position:absolute;z-index:5;pointer-events:none;background:rgba(6,18,34,.97);border:1px solid var(--surface-3);border-radius:12px;padding:8px 11px;font-size:12.5px;line-height:1.45;color:var(--text);white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.45);display:none}
.tip .t{color:var(--text-2);font-weight:600;margin-bottom:2px}
.tip .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}
.tip .ln{display:inline-block;width:12px;height:0;border-top:2px dashed var(--goal);margin-right:5px;vertical-align:3px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--text-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sw{width:10px;height:10px;border-radius:3px;background:var(--data)}
.legend .sw.dot{border-radius:50%}
.legend .ln{width:16px;border-top:2px dashed var(--goal)}

/* ---------- lists ---------- */
.list{padding:4px 0}
.list .item{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:12px 16px;border:0;background:none;text-align:left;border-top:1px solid var(--line)}
.list .item:first-child{border-top:0}
.list .item:active{background:var(--surface-2)}
.list .t1{font-size:16px;font-weight:600}
.list .t2{font-size:13px;color:var(--muted);margin-top:2px}
.list .r{text-align:right;flex:none}
.list .r .t1{font-variant-numeric:tabular-nums}
.list .head{padding:10px 16px 4px;font-size:12.5px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.list .more{display:block;width:100%;padding:12px;border:0;border-top:1px solid var(--line);background:none;color:var(--link);font-weight:600}
.empty-note{padding:18px 16px;color:var(--muted);font-size:14px;text-align:center}
.delta-down{color:var(--good-ink)} .delta-up{color:var(--text-2)}

/* ---------- tab bar ---------- */
.tabbar{position:relative;flex:none;z-index:30;display:flex;justify-content:space-around;background:rgba(15,45,82,.96);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);padding:6px max(4px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(4px, env(safe-area-inset-left))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--stone);background:none;border:0;padding:5px 0;min-height:50px}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--text)}
.tab{position:relative}
.tab.on::after{content:'';position:absolute;top:-6px;left:50%;width:22px;height:3px;margin-left:-11px;border-radius:0 0 3px 3px;background:var(--scarlet)}

/* ---------- sheet ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;opacity:0;transition:opacity .22s}
.backdrop.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;margin:0 auto;max-width:640px;background:var(--surface);border-radius:22px 22px 0 0;max-height:92vh;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px max(18px, env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);border:1px solid var(--line);border-bottom:0}
.sheet.open{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--surface-3);margin:4px auto 8px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-head h2{font-family:var(--display);font-stretch:115%;font-size:19px;margin:0;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.sheet p{color:var(--text-2);font-size:14.5px;line-height:1.45;margin:0 0 12px}
.sheet hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.field{display:block;margin-bottom:14px}
.field > span{display:block;font-size:13.5px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field .hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select,textarea{width:100%;font:inherit;font-size:17px;color:var(--text);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;-webkit-appearance:none;appearance:none;min-height:48px}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=date]{display:block;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
input[type=file]{font-size:14px;padding:10px}
textarea{min-height:90px;resize:vertical;font-size:14px;font-family:ui-monospace,Menlo,monospace}
.check{display:flex;align-items:center;gap:10px;font-size:15px;margin:10px 0;color:var(--text-2)}
.check input{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--accent);-webkit-appearance:auto;appearance:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 14px;font-size:14.5px;font-weight:600;color:var(--text-2)}
.chips button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.calc{background:var(--surface-2);border-radius:12px;padding:11px 13px;font-size:14px;color:var(--text-2);margin-bottom:14px;line-height:1.45}
.err{color:var(--bad-ink);font-size:14px;margin:-4px 0 12px;min-height:1px}
.preview{max-height:220px;overflow-y:auto;overflow-x:hidden;border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.preview .pi{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-top:1px solid var(--line);font-size:14px}
.preview .pi:first-child{border-top:0}

/* ---------- toast & loader ---------- */
.toast{font-weight:650;position:fixed;left:50%;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 18px);transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--brand);padding:11px 18px;border-radius:999px;font-size:14.5px;font-weight:650;z-index:80;opacity:0;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loader{position:fixed;inset:0;z-index:90;background:var(--brand);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;color:var(--text-2);font-size:15px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--surface-3);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.topbar > div:first-child{min-width:0}
.topbar h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- login ---------- */
.auth{position:fixed;inset:0;z-index:85;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.auth-hero{position:relative;height:calc(min(34vh, 260px) + env(safe-area-inset-top));background-size:cover;background-position:62% 40%;display:flex;align-items:flex-end;padding:0 max(22px, env(safe-area-inset-left)) 20px}
.auth-hero::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg, rgba(15,45,82,.35) 0%, rgba(15,45,82,.55) 45%, var(--bg) 100%)}
.auth-brand{position:relative;font-size:clamp(28px, 9vw, 38px)}
.auth-card{width:100%;max-width:440px;margin:0 auto;padding:10px max(22px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 28px) max(22px, env(safe-area-inset-left))}
.auth-logo{width:64px;height:64px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.auth-logo svg{width:40px;height:40px}
.auth h1{font-family:var(--display);font-stretch:118%;font-size:24px;font-weight:800;letter-spacing:-.03em;margin:8px 0 6px}
.auth .lead{color:var(--text-2);font-size:16px;margin:0 0 6px}
.auth .seg{margin:22px 0 18px}
.auth .note{background:var(--accent-soft);color:var(--text);border-radius:12px;padding:11px 13px;font-size:14px;line-height:1.45;margin-bottom:14px}
.auth .fine{color:var(--muted);font-size:12.5px;text-align:center;margin-top:18px;line-height:1.45}

/* ---------- workout logger ---------- */
.wk,.pk{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column}
.wk{z-index:40}
.pk{z-index:50}
.wk-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));border-bottom:1px solid var(--line);flex:none}
.wk-top .side{width:96px;display:flex;align-items:center}
.wk-top .side.r{justify-content:flex-end}
.wk-title{font-family:var(--display);font-stretch:112%;font-size:16px;font-weight:800;letter-spacing:-.01em;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-stats{display:flex;gap:22px;padding:10px 16px;border-bottom:1px solid var(--line);flex:none}
.wk-stats .k{font-size:12px;color:var(--muted);font-weight:600}
.wk-stats .v{font-size:16px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.wk-stats .v.live{color:var(--text)}
.rt-title{font-size:20px;font-weight:700;background:transparent;border:0;padding:4px 0;min-height:0}
.wk-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 0 calc(120px + env(safe-area-inset-bottom))}
.wk-inner{max-width:720px;margin:0 auto;padding:0 max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left))}
.wk-empty{text-align:center;padding:52px 20px 28px;color:var(--text-2)}
.wk-empty .ava{width:64px;height:64px;margin:0 auto}
.wk-empty .ava svg{width:30px;height:30px;color:var(--link)}
.exc{padding:16px 0 12px;border-bottom:1px solid var(--line)}
.exc-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.exc-name{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;color:var(--text);font-size:16.5px;font-weight:650;min-width:0;line-height:1.25}

<script>
(function(){
'use strict';

var BUILD = '%%BUILD%%';
var LS_KEY = 'healthhub.v1';
var APP_VERSION = '1.1';

/* =========================================================
   State
   ========================================================= */
function defaultState(){
  return { v:1, weights:[], lifts:[], runs:[], steps:[], checkins:[],
    goals:{ weight:null, volume:null, distance:null, steps:null },
    prefs:{ weekStart:1, restDefault:90, restByEx:{} },
    routines:[], customExercises:[] };
}
var state = defaultState();
var ui = { view:'overview', ranges:{}, showAll:{} };
var KINDS = ['weights','lifts','runs','steps','checkins'];

/* =========================================================
   Utilities
   ========================================================= */
function $(s, r){ return (r||document).querySelector(s); }
function $all(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function last(a){ return a.length ? a[a.length-1] : undefined; }

function parseDec(s){
  s = String(s == null ? '' : s).trim().replace(/\s/g,'');
  if (!s) return NaN;
  if (/^-?\d+,\d{1,2}$/.test(s)) s = s.replace(',', '.'); else s = s.replace(/,/g,'');

  return isFinite(n) ? n : NaN;
}
function parseIntLoose(s){ var n = parseDec(String(s||'').replace(/[,\s]/g,'')); return isFinite(n) ? Math.round(n) : NaN; }

var nf0 = new Intl.NumberFormat('en-GB', { maximumFractionDigits:0 });
var nf1 = new Intl.NumberFormat('en-GB', { minimumFractionDigits:1, maximumFractionDigits:1 });
var nf2 = new Intl.NumberFormat('en-GB', { minimumFractionDigits:0, maximumFractionDigits:2 });
function f0(v){ return nf0.format(Math.round(v)); }
function f1(v){ return nf1.format(v); }
function signed1(v){ var r = Math.round(v*10)/10; return (r > 0 ? '+' : r < 0 ? '−' : '±') + nf1.format(Math.abs(r)); }

/* ---------- dates (as YYYY-MM-DD strings / day numbers) ---------- */
var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var DOWL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function pad(n){ return (n < 10 ? '0' : '') + n; }
function todayStr(){ var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function dnum(s){ var p = String(s).split('-'); return Math.round(Date.UTC(+p[0], +p[1]-1, +p[2]) / 864e5); }
function dstr(n){ var d = new Date(n*864e5); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth()+1) + '-' + pad(d.getUTCDate()); }
function isDate(s){ return /^\d{4}-\d{2}-\d{2}$/.test(String(s)) && isFinite(dnum(s)); }
function tnum(){ return dnum(todayStr()); }
function fmtDn(n, o){
  o = o || {};
  var d = new Date(n*864e5);
  var s = d.getUTCDate() + ' ' + MON[d.getUTCMonth()];
  if (o.dow) s = DOW[d.getUTCDay()] + ' ' + s;
  if (o.year) s += ' ' + d.getUTCFullYear();
  return s;
}
function fmtD(s, o){ return fmtDn(dnum(s), o); }
function relDay(s){
  var diff = tnum() - dnum(s);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return fmtD(s, { dow:true, year: s.slice(0,4) !== todayStr().slice(0,4) });
}
function weekOf(n){ var dow = new Date(n*864e5).getUTCDay(); return n - ((dow - state.prefs.weekStart + 7) % 7); }
function weekLabel(w){ return fmtDn(w) + ' – ' + fmtDn(w+6); }

/* ---------- durations ---------- */
function parseDuration(s){
  s = String(s||'').trim();
  if (!s) return null;
  if (/^\d+(\.\d+)?$/.test(s)) return parseFloat(s);              // minutes
  var p = s.split(':').map(function(x){ return parseFloat(x); });
  if (p.some(function(x){ return !isFinite(x); })) return NaN;
  if (p.length === 2) return p[0] + p[1]/60;                         // mm:ss
  if (p.length === 3) return p[0]*60 + p[1] + p[2]/60;               // h:mm:ss
  return NaN;
}
function fmtDuration(min){
  if (min == null || !isFinite(min)) return '';

function fmtPace(min, km){ if (!min || !km) return ''; return fmtDuration(min/km) + ' /km'; }

   ========================================================= */

  distance: { key:'distance', view:'running', list:'runs',  title:'Running distance', unit:'km', goalUnit:'km / week',
              val:function(e){ return +e.km || 0; },
              fmt:function(v){ return f1(v) + ' km'; },
              axis:function(v){ return nf2.format(v); } },
  steps:    { key:'steps',    view:'steps',   list:'steps', title:'Steps', unit:'steps', goalUnit:'steps / week',
              val:function(e){ return +e.steps || 0; },
              fmt:function(v){ return f0(v); },
              axis:function(v){ return v >= 1000 ? nf2.format(v/1000) + 'k' : f0(v); } }

function sortList(k){

function sortAll(){ KINDS.forEach(sortList); upgradeLiftVolumes(); }

function weeklyMap(key){
  var M = METRICS[key], m = new Map();
  state[M.list].forEach(function(e){
    var w = weekOf(dnum(e.date)), o = m.get(w) || { sum:0, count:0 };
    o.sum += M.val(e); o.count++; m.set(w, o);
  });
  return m;
}
// weekly target ramps linearly from startValue (start week) to target (target week), flat afterwards
function rampAt(g, w){
  var s = weekOf(dnum(g.startDate)), t = weekOf(dnum(g.targetDate));
  if (t <= s || w >= t) return +g.target;
  if (w <= s) return +g.startValue;
  return +g.startValue + (g.target - g.startValue) * (w - s) / (t - s);
}
function weightLineAt(g, n){
  var s = dnum(g.startDate), t = dnum(g.targetDate);
  if (t <= s || n >= t) return +g.targetKg;
  if (n <= s) return +g.startKg;
  return +g.startKg + (g.targetKg - g.startKg) * (n - s) / (t - s);
}
function avgRecentWeeks(key, n){
  var m = weeklyMap(key), cw = weekOf(tnum()), sum = 0;
  for (var i = 1; i <= n; i++){ var o = m.get(cw - 7*i); sum += o ? o.sum : 0; }
  return sum / n;
}
function weekStatus(key){
  var g = state.goals[key], tn = tnum(), w = weekOf(tn), m = weeklyMap(key);
  var cur = m.get(w) || { sum:0, count:0 };
  var dayIdx = tn - w, daysLeft = 7 - dayIdx;
  var r = { cur:cur, w:w, dayIdx:dayIdx, daysLeft:daysLeft, goal:g };
  if (!g) return r;
  r.req = rampAt(g, w);
  r.pct = r.req > 0 ? cur.sum / r.req : 1;
  r.paceFrac = dayIdx / 7;                          // share of the week already completed before today
  r.remaining = Math.max(0, r.req - cur.sum);
  r.perDay = r.remaining / daysLeft;
  r.status = cur.sum >= r.req ? 'hit' : (cur.sum >= r.req * r.paceFrac - 1e-9 ? 'pace' : 'behind');
  return r;
}
function sortedWeights(){ return state.weights; }
function weightTrend(){
  var tn = tnum(), recent = state.weights.filter(function(e){ return dnum(e.date) >= tn - 28; });
  if (recent.length < 3) return null;
  var xs = recent.map(function(e){ return dnum(e.date); }), ys = recent.map(function(e){ return +e.kg; });
  var span = Math.max.apply(null, xs) - Math.min.apply(null, xs);
  if (span < 7) return null;
  var mx = xs.reduce(function(a,b){return a+b;},0)/xs.length, my = ys.reduce(function(a,b){return a+b;},0)/ys.length;
  var num = 0, den = 0;
  for (var i = 0; i < xs.length; i++){ num += (xs[i]-mx)*(ys[i]-my); den += (xs[i]-mx)*(xs[i]-mx); }
  if (!den) return null;
  var slope = num/den;
  return { slope:slope, perWeek:slope*7, at:function(n){ return my + slope*(n - mx); }, lastX: Math.max.apply(null, xs) };
}
function weightStatus(){
  var ws = state.weights, lw = last(ws), g = state.goals.weight, tn = tnum();
  var r = { last:lw, goal:g, trend:weightTrend() };
  var wk = ws.filter(function(e){ return dnum(e.date) > tn - 7; });
  r.avg7 = wk.length ? wk.reduce(function(a,e){ return a + (+e.kg); }, 0) / wk.length : null;
  if (!lw) return r;
  r.first = ws[0];
  if (!g) return r;
  var losing = +g.targetKg < +g.startKg;
  r.losing = losing;
  r.lineAtLast = weightLineAt(g, dnum(lw.date));
  r.lineToday = weightLineAt(g, tn);
  r.diff = lw.kg - r.lineAtLast;                     // + = above the line
  var ahead = losing ? r.diff <= 0 : r.diff >= 0;
  r.status = ahead ? 'ahead' : (Math.abs(r.diff) <= 0.3 ? 'close' : 'behind');
  r.changed = lw.kg - g.startKg;
  r.toGo = Math.abs(lw.kg - g.targetKg);
  r.reached = losing ? lw.kg <= g.targetKg : lw.kg >= g.targetKg;
  var weeksLeft = (dnum(g.targetDate) - tn) / 7;
  r.weeksLeft = weeksLeft;
  r.needRate = weeksLeft > 0 ? (g.targetKg - lw.kg) / weeksLeft : null;
  var planWeeks = (dnum(g.targetDate) - dnum(g.startDate)) / 7;
  r.planRate = planWeeks > 0 ? (g.targetKg - g.startKg) / planWeeks : null;
  if (r.trend && !r.reached){
    var towards = losing ? r.trend.slope < -0.002 : r.trend.slope > 0.002;
    if (towards){
      var fromN = r.trend.lastX, cur = r.trend.at(fromN);
      var days = (g.targetKg - cur) / r.trend.slope;
      if (days > 0 && days < 3650) r.projected = Math.round(fromN + days);
    } else r.projected = 'away';
  }
  return r;
}

/* =========================================================
   Storage: Claude account (artifact) or this device (installed app)
   ========================================================= */
var Store = { mode:'loading', col:null, lastWritten:{}, queued:{}, inflight:{}, known:{}, slowTimer:null, sync:'' };

function setSync(s){
  Store.sync = s;
  var dot = $('#syncDot'), txt = $('#syncText');
  var map = {
    ok:['ok', Store.mode === 'account' ? 'Synced to your account' : 'Synced to your Claude account'], saving:['busy','Saving…'], connecting:['busy','Connecting…'],
    offline:['busy','Offline — will sync when you’re back online'],
    slow:['busy','Can’t reach saved data yet'], error:['err','Not saved — check connection'],
    local:['ok','Saved on this iPhone'], browser:['busy','Saved in this browser only'], memory:['err','Not saving — storage blocked']
  };
  var v = map[s] || ['', ''];
  dot.className = 'sync-dot ' + v[0]; txt.textContent = v[1];
}

function loadLocal(){
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw){ var d = JSON.parse(raw); state = normalise(d); }
    Store.mode = 'local';
    setSync(BUILD === 'pwa' ? 'local' : 'browser');
    if (BUILD === 'pwa' && navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch(e){} }
  } catch(e){ Store.mode = 'memory'; setSync('memory'); }
}
var localTimer = null;
function saveLocal(){
  clearTimeout(localTimer);
  localTimer = setTimeout(function(){
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); }
    catch(e){ Store.mode = 'memory'; setSync('memory'); toast('Couldn’t save on this device'); }
  }, 120);
}

function normalise(d){
  var s = defaultState();
  if (!d || typeof d !== 'object') return s;
  KINDS.forEach(function(k){ if (Array.isArray(d[k])) s[k] = d[k].filter(function(e){ return e && isDate(e.date); }).map(function(e){ return Object.assign({}, e, { id: e.id || uid() }); }); });
  if (d.goals) ['weight','volume','distance','steps'].forEach(function(k){ if (d.goals[k]) s.goals[k] = Object.assign({}, d.goals[k]); });
  if (d.prefs) s.prefs = Object.assign(s.prefs, d.prefs);
  if (Array.isArray(d.routines)) s.routines = d.routines.filter(function(r){ return r && r.name && Array.isArray(r.exercises); });
  if (Array.isArray(d.customExercises)) s.customExercises = d.customExercises.filter(function(c){ return c && c.n; });
  sortAllIn(s);
  return s;
}
function sortAllIn(s){ var keep = state; state = s; sortAll(); state = keep; }

async function waitForClaude(ms){
  var t0 = Date.now();
  while (!(window.claude && typeof window.claude.use === 'function')){
    if (Date.now() - t0 > ms) return null;
    await sleep(100);
  }
  return window.claude;
}
function withTimeout(p, ms){ return Promise.race([p, sleep(ms).then(function(){ return null; })]); }

async function initCloud(){
  var c = await waitForClaude(2500);
  if (!c) return false;
  var db = null, user = null, id = null;
  try { db = await withTimeout(c.use('db'), 12000); } catch(e){ db = null; }
  if (!db) return false;
  try { user = await withTimeout(c.use('user'), 8000); id = user ? await user.id() : null; } catch(e){ id = null; }
  if (!id) return false;
  try { var me = await withTimeout(user.me(), 4000); Store.name = (me && me.name) || ''; } catch(e){ Store.name = ''; }
  Store.col = db.collection('data/users/' + id);
  Store.mode = 'cloud';
  setSync('connecting');
  return new Promise(function(resolve){
    var first = true;
    function done(){ if (first){ first = false; resolve(true); } }
    Store.slowTimer = setTimeout(function(){ setSync('slow'); done(); }, 10000);
    Store.col.onSnapshot(function(snap){
      applySnapshot(snap.docs);
      if (!snap.metadata.fromCache){ clearTimeout(Store.slowTimer); if (!anyInflight()) setSync('ok'); }
      done();
      if (!first) renderSoon();
    }, function(err){
      clearTimeout(Store.slowTimer);
      setSync('error');
      if (err && err.code === 'revoked') toast('Saving is no longer available on this page');
      done();
    });
  });
}
function anyInflight(){ return Object.keys(Store.inflight).some(function(k){ return Store.inflight[k]; }); }

function applySnapshot(docs){
  var next = defaultState();
  next.prefs = Object.assign({}, state.prefs);
  docs.forEach(function(d){
    if (!d.exists) return;
    var id = d.id, data = d.data() || {};
    if (Store.queued[id]) data = Store.queued[id];
    else if (!Store.inflight[id]) Store.lastWritten[id] = JSON.stringify(data);
    if (id === 'settings'){
      if (data.goals) ['weight','volume','distance','steps'].forEach(function(k){ next.goals[k] = data.goals[k] ? Object.assign({}, data.goals[k]) : null; });
      if (data.prefs) next.prefs = Object.assign(next.prefs, data.prefs);
      if (Array.isArray(data.routines)) next.routines = data.routines.slice();
      if (Array.isArray(data.customExercises)) next.customExercises = data.customExercises.slice();
      return;
    }
    var m = /^(weights|lifts|runs|steps|checkins)-(\d{4})(?:-\d{2})?$/.exec(id);
    if (m){
      (Store.known[m[1]] = Store.known[m[1]] || {})[id] = 1;
      (Array.isArray(data.entries) ? data.entries : []).forEach(function(e){ if (e && isDate(e.date)) next[m[1]].push(Object.assign({}, e)); });
    }
  });
  sortAllIn(next);
  state = next;
}

function cloudWrite(id, data){
  var json = JSON.stringify(data);
  if (Store.lastWritten[id] === json) return;
  Store.lastWritten[id] = json;
  Store.queued[id] = JSON.parse(json);
  if (!Store.inflight[id]) flush(id);
}
async function flush(id){
  Store.inflight[id] = true;
  setSync('saving');
  while (Store.queued[id]){
    var d = Store.queued[id];
    delete Store.queued[id];
    try { await Store.col.doc(id).set(d); }
    catch(err){
      if (err && err.code === 'unavailable'){
        await sleep(500 + Math.random()*700);
        try { await Store.col.doc(id).set(d); } catch(e2){ writeFailed(e2, id); }
      } else writeFailed(err, id);
    }
  }
  Store.inflight[id] = false;
  if (!anyInflight() && Store.sync !== 'error') setSync('ok');
}
function writeFailed(err, id){
  Store.lastWritten[id] = null;
  setSync('error');
  toast(err && err.code === 'quota_exceeded' ? 'Storage is full — that change wasn’t saved' : 'Couldn’t save that change — check your connection');
}

/* =========================================================
   Accounts (installed app): Supabase email + password login.
   Each person's data lives in their own rows (row-level security),
   with a per-person cache on the device so it opens instantly and works offline.
   ========================================================= */
var CFG = window.HH_CONFIG || {};
var sb = null;
var Acc = { user:null, dirty:{}, q:{}, inflight:{} };
function accountsEnabled(){ return BUILD === 'pwa' && !!(CFG.supabaseUrl && CFG.supabaseKey && window.supabase && typeof window.supabase.createClient === 'function'); }
function displayName(u){
  var m = (u && u.user_metadata) || {};
  return String(m.name || m.full_name || (u && u.email ? u.email.split('@')[0] : '') || '').trim();
}
function firstName(){ var n = String(Store.name || '').trim(); return n ? n.split(/\s+/)[0] : ''; }
function cacheKey(){ return LS_KEY + '.u.' + Acc.user.id; }
function saveCache(){ try { localStorage.setItem(cacheKey(), JSON.stringify({ state:state, dirty:Object.keys(Acc.dirty) })); } catch(e){} }
function loadCache(){
  state = defaultState(); Acc.dirty = {};
  try {
    var raw = localStorage.getItem(cacheKey());
    if (raw){ var c = JSON.parse(raw); state = normalise(c.state); (c.dirty || []).forEach(function(k){ Acc.dirty[k] = 1; }); }
  } catch(e){}
}
function rowFor(key){ return key === 'settings' ? { v:1, goals:state.goals, prefs:state.prefs, routines:state.routines, customExercises:state.customExercises } : { entries:state[key] }; }
function applyRow(key, data, s){
  data = data || {};
  if (key === 'settings'){
    if (data.goals) ['weight','volume','distance','steps'].forEach(function(k){ s.goals[k] = data.goals[k] ? Object.assign({}, data.goals[k]) : null; });
    if (data.prefs) s.prefs = Object.assign(s.prefs, data.prefs);
    if (Array.isArray(data.routines)) s.routines = data.routines.slice();
    if (Array.isArray(data.customExercises)) s.customExercises = data.customExercises.slice();
  } else if (KINDS.indexOf(key) >= 0 && Array.isArray(data.entries)){
    s[key] = data.entries.filter(function(e){ return e && isDate(e.date); }).map(function(e){ return Object.assign({}, e); });
  }
}
function accBusy(){ return Object.keys(Acc.inflight).some(function(k){ return Acc.inflight[k]; }); }
function offlineNow(){ return navigator.onLine === false; }
async function pullRemote(){
  if (!Acc.user || accBusy()) return false;
  var uid = Acc.user.id, res;
  try { res = await sb.from('health_data').select('key,data'); } catch(e){ res = { error:e }; }
  if (!Acc.user || Acc.user.id !== uid) return false;           // logged out / switched meanwhile
  if (res.error){ setSync(offlineNow() ? 'offline' : 'error'); return false; }
  var s = normalise(clone(state));
  (res.data || []).forEach(function(r){ if (!Acc.dirty[r.key]) applyRow(r.key, r.data, s); });
  sortAllIn(s); state = s; saveCache();
  if (!Object.keys(Acc.dirty).length) setSync('ok');
  return true;
}
function accWrite(key){
  Acc.dirty[key] = 1; saveCache();
  Acc.q[key] = clone(rowFor(key));
  if (!Acc.inflight[key]) accFlush(key);
}
async function accFlush(key){
  var uid = Acc.user && Acc.user.id; if (!uid) return;
  Acc.inflight[key] = true;
  setSync('saving');
  while (Acc.q[key]){
    var d = Acc.q[key]; delete Acc.q[key];
    var res;
    try { res = await sb.from('health_data').upsert({ user_id:uid, key:key, data:d, updated_at:new Date().toISOString() }, { onConflict:'user_id,key' }); }
    catch(e){ res = { error:e }; }
    if (res && res.error){
      Acc.inflight[key] = false;
      setSync(offlineNow() ? 'offline' : 'error');
      if (!offlineNow()) toast('Couldn’t sync — it will retry automatically');
      clearTimeout(accFlush.retry); accFlush.retry = setTimeout(resync, 20000);
      return;
    }
    if (!Acc.q[key] && Acc.user && Acc.user.id === uid){ delete Acc.dirty[key]; saveCache(); }
  }
  Acc.inflight[key] = false;
  if (!accBusy() && !Object.keys(Acc.dirty).length) setSync('ok');
}
function flushDirty(){
  if (!Acc.user) return;
  Object.keys(Acc.dirty).forEach(function(k){ if (!Acc.inflight[k]){ Acc.q[k] = clone(rowFor(k)); accFlush(k); } });
}
async function resync(){
  if (Store.mode !== 'account' || !Acc.user) return;
  if (Object.keys(Acc.dirty).length){ flushDirty(); return; }
  if (await pullRemote()) renderSoon();
}
window.addEventListener('online', resync);
document.addEventListener('visibilitychange', function(){ if (!document.hidden) resync(); });

async function startUser(user, fresh){
  Acc.user = user; Acc.q = {}; Acc.inflight = {};
  Store.mode = 'account'; Store.name = displayName(user);
  loadCache();
  hideAuth();
  ui.view = !fresh && VIEWS.indexOf(location.hash.slice(1)) >= 0 ? location.hash.slice(1) : 'overview';
  if (fresh){ try { location.hash = 'overview'; } catch(e){} scrollToTop(); }
  render();
  setSync(offlineNow() ? 'offline' : 'connecting');
  await pullRemote();
  flushDirty();
  render();
  wkRestore();
  offerLegacyData();
}

function offerLegacyData(){

/* ---------- login screen ---------- */
var HERO_IMG = '%%LOGIN_HERO%%';
var LOGO = '<svg viewBox="0 0 40 40" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12l26 18" stroke="var(--goal)" stroke-width="3" stroke-dasharray="4 4"/><path d="M6 9l6 4 4-2 6 9 5-1 7 10" stroke="var(--accent)" stroke-width="3.5"/></svg>';
function showAuth(mode, note){

  if (Object.keys(Acc.dirty).length){
    flushDirty();
    for (var i = 0; i < 40 && (accBusy() || Object.keys(Acc.dirty).length); i++) await sleep(150);
    if (Object.keys(Acc.dirty).length && !force) return false;
  }
  var clean = !Object.keys(Acc.dirty).length;
  try { if (clean) localStorage.removeItem(cacheKey()); } catch(e){}
  wkDrop();
  Acc.user = null; Acc.q = {}; Acc.inflight = {}; Acc.dirty = {}; PH.urls = {}; PH.waiting = {};
  Store.mode = 'loading'; Store.name = '';
  state = defaultState(); ui.ranges = {}; ui.showAll = {};
  try { await sb.auth.signOut({ scope:'local' }); } catch(e){}
  closeSheet(); $('#main').innerHTML = ''; setSync('');
  showAuth('login');
  return true;
}

function persist(kinds){
  exIndexCache = null;
  if (Store.mode === 'account'){ kinds.forEach(accWrite); return; }
  if (Store.mode === 'cloud'){
    kinds.forEach(function(k){
      if (k === 'settings') cloudWrite('settings', clone({ v:1, goals:state.goals, prefs:state.prefs, routines:state.routines, customExercises:state.customExercises }));
      else {
        var groups = {};
        // workouts carry every set, so they're split by month to stay well under the per-document size limit
        state[k].forEach(function(e){ var id = k + '-' + e.date.slice(0, k === 'lifts' ? 7 : 4); (groups[id] = groups[id] || []).push(e); });
        var known = Store.known[k] = Store.known[k] || {};
        Object.keys(groups).forEach(function(id){ known[id] = 1; });
        Object.keys(known).forEach(function(id){ cloudWrite(id, clone({ entries: groups[id] || [] })); });
      }
    });
  } else if (Store.mode === 'local') saveLocal();
}

/* =========================================================
   Charts (SVG, no libraries)
   ========================================================= */
function niceStep(range, count){
  var raw = range / count, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
}
function mountCharts(){
  var w = $('#chart-weight'); if (w) drawWeightChart(w);
  ['volume','distance','steps'].forEach(function(k){ var el = $('#chart-' + k); if (el) drawWeeklyChart(el, k); });
}

function drawWeightChart(host){
  var W = Math.max(260, host.clientWidth || 320), H = 236, m = { l:40, r:12, t:14, b:26 };
  var pw = W - m.l - m.r, ph = H - m.t - m.b;
  var ws = state.weights, g = state.goals.weight, tn = tnum();
  var range = defaultRange('weight');
  if (range === 'goal' && !g) range = 'all';
  var x0, x1;
  if (range === '1m'){ x0 = tn - 30; x1 = tn; }
  else if (range === '3m'){ x0 = tn - 91; x1 = tn; }
  else if (range === '6m'){ x0 = tn - 182; x1 = tn; }
  else if (range === 'goal'){ x0 = dnum(g.startDate); x1 = Math.max(dnum(g.targetDate), tn); }
  else {
    var ns = ws.map(function(e){ return dnum(e.date); });
    if (g) ns.push(dnum(g.startDate), dnum(g.targetDate));
    ns.push(tn);
    x0 = Math.min.apply(null, ns); x1 = Math.max.apply(null, ns);
  }
  if (x1 - x0 < 6){ x0 = x1 - 6; }
  var pts = ws.filter(function(e){ var n = dnum(e.date); return n >= x0 && n <= x1; }).map(function(e){ return { n:dnum(e.date), y:+e.kg, e:e }; });
  var gl = [];
  if (g){
    var s = dnum(g.startDate), t = dnum(g.targetDate);
    var a = Math.max(x0, s), b = Math.min(x1, t);
    if (a <= b){ gl.push([a, weightLineAt(g, a)]); gl.push([b, weightLineAt(g, b)]); }
    if (x1 > t){ if (!gl.length) gl.push([Math.max(x0, t), +g.targetKg]); gl.push([x1, +g.targetKg]); }
  }
  if (!pts.length && !gl.length){ host.innerHTML = '<div class="empty">' + (ws.length ? 'No weigh-ins in this range.' : 'Log your first weigh-in to start the chart.') + '</div>'; return; }
  var ys = pts.map(function(p){ return p.y; }).concat(gl.map(function(p){ return p[1]; }));
  var ymin = Math.min.apply(null, ys), ymax = Math.max.apply(null, ys);
  var padY = Math.max(0.4, (ymax - ymin) * 0.12);
  var step = niceStep((ymax - ymin) + 2*padY, 4);
  var lo = Math.floor((ymin - padY) / step) * step, hi = Math.ceil((ymax + padY) / step) * step;
  var X = function(n){ return m.l + (n - x0) / (x1 - x0) * pw; };
  var Y = function(v){ return m.t + (hi - v) / (hi - lo) * ph; };
  var o = [];
  o.push('<svg viewBox="0 0 ' + W + ' ' + H + '" height="' + H + '" role="img" aria-label="Weight chart">');
  for (var v = lo; v <= hi + 1e-9; v += step){
    var yy = Y(v).toFixed(1);
    o.push('<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--grid)" stroke-width="1"/>');
    o.push('<text x="' + (m.l - 7) + '" y="' + yy + '" text-anchor="end" dominant-baseline="middle">' + (step < 1 ? nf1.format(v) : f0(v)) + '</text>');
  }
  var nt = clamp(Math.floor(pw / 78), 2, 6);
  for (var i = 0; i < nt; i++){
    var n = Math.round(x0 + i * (x1 - x0) / (nt - 1));
    var anchor = i === 0 ? 'start' : i === nt - 1 ? 'end' : 'middle';
    o.push('<text x="' + X(n).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="' + anchor + '">' + fmtDn(n, { year: (x1 - x0) > 300 && (i === 0 || i === nt-1) }) + '</text>');
  }
  if (tn >= x0 && tn <= x1 && tn < x1){
    o.push('<line x1="' + X(tn).toFixed(1) + '" x2="' + X(tn).toFixed(1) + '" y1="' + m.t + '" y2="' + (H - m.b) + '" stroke="var(--stone)" stroke-opacity=".5" stroke-dasharray="2 3"/>');
    o.push('<text x="' + (X(tn) + 4).toFixed(1) + '" y="' + (m.t + 8) + '" style="font-size:10px">today</text>');
  }
  if (gl.length){
    o.push('<polyline fill="none" stroke="var(--goal)" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round" points="' + gl.map(function(p){ return X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1); }).join(' ') + '"/>');
    var tgt = dnum(g.targetDate);
    if (tgt >= x0 && tgt <= x1){
      o.push('<circle cx="' + X(tgt).toFixed(1) + '" cy="' + Y(+g.targetKg).toFixed(1) + '" r="4" fill="var(--goal)" stroke="var(--surface)" stroke-width="2"/>');
    }
  }
  if (pts.length > 1){
    o.push('<polyline fill="none" stroke="var(--data)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="' + pts.map(function(p){ return X(p.n).toFixed(1) + ',' + Y(p.y).toFixed(1); }).join(' ') + '"/>');
  }
  var showDots = pts.length <= 45;
  pts.forEach(function(p, i){
    if (showDots || i === pts.length - 1) o.push('<circle cx="' + X(p.n).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="' + (i === pts.length - 1 ? 4.5 : 3.5) + '" fill="var(--data)" stroke="var(--surface)" stroke-width="2"/>');
  });
  o.push('<g class="hl" style="display:none"><line class="hx" y1="' + m.t + '" y2="' + (H - m.b) + '" stroke="var(--stone)" stroke-width="1"/><circle class="hc" r="6" fill="var(--data)" stroke="var(--text)" stroke-width="2"/></g>');
  o.push('<rect class="hit" x="' + m.l + '" y="0" width="' + pw + '" height="' + H + '" fill="transparent"/>');
  o.push('</svg><div class="tip"></div>');
  host.innerHTML = o.join('');

  if (!pts.length) return;
  attachHover(host, function(px){
    var best = 0, bd = Infinity;
    pts.forEach(function(p, i){ var d = Math.abs(X(p.n) - px); if (d < bd){ bd = d; best = i; } });
    var p = pts[best], cx = X(p.n), cy = Y(p.y);
    var hl = $('.hl', host); hl.style.display = '';
    $('.hx', hl).setAttribute('x1', cx); $('.hx', hl).setAttribute('x2', cx);
    $('.hc', hl).setAttribute('cx', cx); $('.hc', hl).setAttribute('cy', cy);
    var html = '<div class="t">' + esc(fmtDn(p.n, { dow:true, year:true })) + '</div><div><i class="sw" style="background:var(--data)"></i><b>' + f1(p.y) + ' kg</b></div>';
    if (g && p.n >= dnum(g.startDate)){
      var lv = weightLineAt(g, p.n), df = p.y - lv;
      html += '<div><i class="ln"></i>Goal line ' + f1(lv) + ' kg <span class="muted">(' + (Math.abs(df) < 0.05 ? 'on it' : f1(Math.abs(df)) + (df > 0 ? ' above' : ' below')) + ')</span></div>';
    }
    if (p.e.note) html += '<div class="muted">' + esc(p.e.note) + '</div>';
    return { x:cx, y:cy, html:html };
  }, function(){ $('.hl', host).style.display = 'none'; });
}

function weeklyRange(key){
  var g = state.goals[key], cw = weekOf(tnum()), range = defaultRange(key);
  if (range === 'goal' && !g) range = '12w';
  var w0, w1 = cw;
  if (range === '8w') w0 = cw - 7*7;
  else if (range === '12w') w0 = cw - 11*7;
  else if (range === '26w') w0 = cw - 25*7;
  else if (range === 'goal'){ w0 = weekOf(dnum(g.startDate)); w1 = Math.max(cw, weekOf(dnum(g.targetDate))); if (w0 > cw) w0 = cw; }
  else {
    var list = state[METRICS[key].list], first = list.length ? weekOf(dnum(list[0].date)) : cw;
    if (g) first = Math.min(first, weekOf(dnum(g.startDate)));
    w0 = Math.min(first, cw - 3*7);
  }
  return { w0:w0, w1:w1, cw:cw };
}

function drawWeeklyChart(host, key){
  var M = METRICS[key], g = state.goals[key], map = weeklyMap(key);
  var W = Math.max(260, host.clientWidth || 320), H = 226, m = { l:44, r:8, t:18, b:26 };
  var pw = W - m.l - m.r, ph = H - m.t - m.b;
  var rr = weeklyRange(key), weeks = [];
  for (var w = rr.w0; w <= rr.w1; w += 7) weeks.push(w);
  var gs = g ? weekOf(dnum(g.startDate)) : null;
  var data = weeks.map(function(w){
    var o = map.get(w) || { sum:0, count:0 };
    return { w:w, sum:o.sum, count:o.count, req: g && w >= gs ? rampAt(g, w) : null, future: w > rr.cw, current: w === rr.cw };
  });
  var ymax = 0;
  data.forEach(function(d){ ymax = Math.max(ymax, d.sum, d.req || 0); });
  if (!ymax){ host.innerHTML = '<div class="empty">Log your first ' + (key === 'volume' ? 'session' : key === 'distance' ? 'run' : 'steps') + ' to start the chart.</div>'; return; }
  var step = niceStep(ymax * 1.1, 4), hi = Math.ceil(ymax * 1.1 / step) * step;
  var band = pw / data.length, bw = clamp(band * 0.62, 3, 30);
  var X = function(i){ return m.l + band * i + band / 2; };
  var Y = function(v){ return m.t + (hi - v) / hi * ph; };
  var o = ['<svg viewBox="0 0 ' + W + ' ' + H + '" height="' + H + '" role="img" aria-label="' + esc(M.title) + ' per week">'];
  for (var v = 0; v <= hi + 1e-9; v += step){
    var yy = Y(v).toFixed(1);
    o.push('<line x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + yy + '" y2="' + yy + '" stroke="' + (v === 0 ? 'rgba(122,140,163,.4)' : 'var(--grid)') + '" stroke-width="1"/>');
    o.push('<text x="' + (m.l - 7) + '" y="' + yy + '" text-anchor="end" dominant-baseline="middle">' + esc(M.axis(v)) + '</text>');
  }
  o.push('<rect class="hb" y="' + m.t + '" height="' + ph + '" width="' + band.toFixed(1) + '" fill="rgba(122,140,163,.12)" rx="6" style="display:none"/>');
  data.forEach(function(d, i){
    if (d.future || d.sum <= 0) return;
    var x = X(i) - bw/2, y = Y(d.sum), hgt = Math.max(1, Y(0) - y);
    var r = Math.min(4, bw/2, hgt);
    o.push('<path d="M' + x.toFixed(1) + ',' + (y + hgt).toFixed(1) + 'V' + (y + r).toFixed(1) + 'Q' + x.toFixed(1) + ',' + y.toFixed(1) + ' ' + (x + r).toFixed(1) + ',' + y.toFixed(1) +
           'H' + (x + bw - r).toFixed(1) + 'Q' + (x + bw).toFixed(1) + ',' + y.toFixed(1) + ' ' + (x + bw).toFixed(1) + ',' + (y + r).toFixed(1) + 'V' + (y + hgt).toFixed(1) + 'Z" fill="var(--data)"' + (d.current ? ' fill-opacity=".6"' : '') + '/>');
    if (d.req != null && d.sum >= d.req && band >= 13) o.push('<text x="' + X(i).toFixed(1) + '" y="' + (y - 5).toFixed(1) + '" text-anchor="middle" style="fill:var(--text-2);font-size:11px;font-weight:700">✓</text>');
  });
  var rl = data.map(function(d, i){ return d.req != null ? X(i).toFixed(1) + ',' + Y(d.req).toFixed(1) : null; }).filter(Boolean);
  if (rl.length === 1) rl.push((parseFloat(rl[0]) + band/2).toFixed(1) + ',' + rl[0].split(',')[1]);
  if (rl.length) o.push('<polyline fill="none" stroke="var(--goal)" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round" stroke-linejoin="round" points="' + rl.join(' ') + '"/>');
  var maxLabels = Math.max(2, Math.floor(pw / 54)), every = Math.ceil(data.length / maxLabels);
  data.forEach(function(d, i){
    if ((data.length - 1 - i) % every !== 0) return;
    o.push('<text x="' + X(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle"' + (d.current ? ' style="fill:var(--text-2);font-weight:600"' : '') + '>' + (d.current ? 'This wk' : fmtDn(d.w)) + '</text>');
  });
  o.push('<rect class="hit" x="' + m.l + '" y="0" width="' + pw + '" height="' + H + '" fill="transparent"/>');
  o.push('</svg><div class="tip"></div>');
  host.innerHTML = o.join('');

  attachHover(host, function(px){
    var i = clamp(Math.floor((px - m.l) / band), 0, data.length - 1), d = data[i];
    var hb = $('.hb', host); hb.style.display = ''; hb.setAttribute('x', (m.l + band * i).toFixed(1));
    var unitWord = key === 'volume' ? 'session' : key === 'distance' ? 'run' : 'day';
    var html = '<div class="t">' + (d.current ? 'This week · ' : '') + esc(weekLabel(d.w)) + '</div>';
    html += d.future ? '<div class="muted">Upcoming week</div>' : '<div><i class="sw" style="background:var(--data)"></i><b>' + esc(M.fmt(d.sum)) + (key === 'steps' ? ' steps' : '') + '</b> <span class="muted">· ' + d.count + ' ' + unitWord + (d.count === 1 ? '' : 's') + '</span></div>';
    if (d.req != null) html += '<div><i class="ln"></i>Target ' + esc(M.fmt(d.req)) + (d.future ? '' : ' <span class="muted">(' + Math.round(d.req ? d.sum / d.req * 100 : 100) + '%)</span>') + '</div>';
    return { x:X(i), y: Y(Math.max(d.sum, d.req || 0)), html:html };
  }, function(){ $('.hb', host).style.display = 'none'; });
}

function attachHover(host, pick, clear){
  var svg = $('svg', host), tip = $('.tip', host);
  function show(ev){
    var rect = svg.getBoundingClientRect(), scale = rect.width / svg.viewBox.baseVal.width;
    var px = (ev.clientX - rect.left) / scale;
    var res = pick(px); if (!res) return;
    if (activeTip && activeTip !== hide) activeTip();
    tip.innerHTML = res.html; tip.style.display = 'block';
    var tw = tip.offsetWidth, th = tip.offsetHeight, hw = host.clientWidth;
    var left = clamp(res.x * scale - tw/2, 0, Math.max(0, hw - tw));
    var top = res.y * scale - th - 12; if (top < 0) top = res.y * scale + 14;
    tip.style.left = left + 'px'; tip.style.top = top + 'px';
    activeTip = hide;
  }
  function hide(){ tip.style.display = 'none'; clear(); }
  svg.addEventListener('pointermove', show);
  svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointerleave', function(ev){ if (ev.pointerType === 'mouse') hide(); });
}
var activeTip = null;
document.addEventListener('pointerdown', function(ev){ if (activeTip && !ev.target.closest('.chart')){ activeTip(); activeTip = null; } });

function openSheet(title, body, mount){
  var root = $('#sheetRoot');
  root.innerHTML = '<div class="backdrop"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '"><div class="grab"></div>' +
    '<div class="sheet-head"><h2>' + esc(title) + '</h2><button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>' +
    '<div class="sheet-body">' + body + '</div></div>';
  var bd = $('.backdrop', root), sh = $('.sheet', root);
  requestAnimationFrame(function(){ bd.classList.add('open'); sh.classList.add('open'); });
  bd.addEventListener('click', closeSheet);
  $('[data-close]', sh).addEventListener('click', closeSheet);
  document.body.style.overflow = 'hidden';
  if (mount) mount(sh);
}
function closeSheet(){
  var root = $('#sheetRoot'), bd = $('.backdrop', root), sh = $('.sheet', root);
  document.body.style.overflow = '';
  if (!sh) return;
  bd.classList.remove('open'); sh.classList.remove('open');
  setTimeout(function(){ if (!sh.classList.contains('open')) root.innerHTML = ''; }, 260);
}
function confirmButton(btn, label, fn){
  var armed = false, t = null, orig = btn.textContent;
  btn.addEventListener('click', function(){
    if (!armed){ armed = true; btn.textContent = label; t = setTimeout(function(){ armed = false; btn.textContent = orig; }, 3500); return; }
    clearTimeout(t); fn();
  });
}
function toast(msg){
  var t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2400);
}
function field(label, inner, hint){ return '<label class="field"><span>' + label + '</span>' + inner + (hint ? '<div class="hint">' + hint + '</div>' : '') + '</label>'; }
function dateInput(name, val, max){ return '<input type="date" name="' + name + '" value="' + esc(val) + '"' + (max ? ' max="' + max + '"' : '') + ' required>'; }

function saveEntry(list, entry, msg){
  var arr = state[list], i = -1;
  for (var k = 0; k < arr.length; k++) if (arr[k].id === entry.id){ i = k; break; }
  if (i >= 0) arr[i] = entry; else arr.push(entry);
  sortList(list);
  persist([list]);
  closeSheet(); render(); toast(msg || 'Saved');
}
function deleteEntry(list, id){
  state[list] = state[list].filter(function(e){ return e.id !== id; });
  persist([list]);
  closeSheet(); render(); toast('Deleted');
}
function findEntry(list, id){ for (var i = 0; i < state[list].length; i++) if (state[list][i].id === id) return state[list][i]; return null; }

function parseCSV(text){
  var rows = [], row = [], f = '', q = false, i = 0, c;

    c = text[i];

      else f += c;
    } else if (c === '"') q = true;
    else if (c === ','){ row.push(f); f = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i+1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;

}
var MONIDX = { jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11 };
function parseLooseDateTime(s){
  s = String(s || '').trim(); if (!s) return null;
  var m, y, mo, d, h = 0, mi = 0, ap;
  if ((m = /^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/.exec(s))){ y=+m[1]; mo=+m[2]-1; d=+m[3]; h=+(m[4]||0); mi=+(m[5]||0); }
  else if ((m = /^(\d{1,2})\s+([A-Za-z]{3,9})\.?,?\s+(\d{4}),?\s*(?:(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp][Mm])?)?/.exec(s))){ d=+m[1]; mo=MONIDX[m[2].slice(0,4).toLowerCase()] ?? MONIDX[m[2].slice(0,3).toLowerCase()]; y=+m[3]; h=+(m[4]||0); mi=+(m[5]||0); ap=m[6]; }
  else if ((m = /^([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4}),?\s*(?:(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp][Mm])?)?/.exec(s))){ mo=MONIDX[m[1].slice(0,4).toLowerCase()] ?? MONIDX[m[1].slice(0,3).toLowerCase()]; d=+m[2]; y=+m[3]; h=+(m[4]||0); mi=+(m[5]||0); ap=m[6]; }
  else if ((m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:,?\s*(\d{1,2}):(\d{2}))?/.exec(s))){ d=+m[1]; mo=+m[2]-1; y=+m[3]; h=+(m[4]||0); mi=+(m[5]||0); if (mo > 11){ var tmp=d; d=mo+1; mo=tmp-1; } }
  else { var t = new Date(s); if (isNaN(t)) return null; y=t.getFullYear(); mo=t.getMonth(); d=t.getDate(); h=t.getHours(); mi=t.getMinutes(); }
  if (mo == null || isNaN(mo) || !(d >= 1 && d <= 31) || !(y > 1990)) return null;
  if (ap){ ap = ap.toLowerCase(); if (ap === 'pm' && h < 12) h += 12; if (ap === 'am' && h === 12) h = 0; }
  return { date: y + '-' + pad(mo+1) + '-' + pad(d), mins: Date.UTC(y, mo, d, h, mi) / 60000 };
}
function parseHevy(text, includeWarmups){
  var rows = parseCSV(text);
  if (rows.length < 2) throw new Error('That file looks empty.');
  var hdr = rows[0].map(function(h){ return h.trim().toLowerCase(); });
  function ix(n){ return hdr.indexOf(n); }
  var iT = ix('title'), iS = ix('start_time'), iE = ix('end_time'), iEx = ix('exercise_title'), iType = ix('set_type'), iR = ix('reps');
  var iKg = ix('weight_kg'), iLb = ix('weight_lbs'), iKm = ix('distance_km'), iMi = ix('distance_miles'), iSec = ix('duration_seconds');
  if (iT < 0 || iS < 0 || iR < 0 || (iKg < 0 && iLb < 0)) throw new Error('This doesn’t look like a Hevy workout export (missing title / start_time / weight / reps columns).');
  var map = new Map(), bad = 0;
  for (var r = 1; r < rows.length; r++){
    var row = rows[r]; if (row.length < hdr.length - 2) continue;
    var title = (row[iT] || '').trim(), st = row[iS];
    var key = title + '|' + st, w = map.get(key);
    if (!w){
      var pd = parseLooseDateTime(st); if (!pd){ bad++; continue; }
      var pe = iE >= 0 ? parseLooseDateTime(row[iE]) : null;
      w = { key:key, name: title || 'Workout', date: pd.date, durationMin: pe && pe.mins > pd.mins ? Math.round(pe.mins - pd.mins) : undefined, volume:0, sets:0, exList:[], exMap:{} };
      map.set(key, w);
    }
    var type = iType >= 0 ? (row[iType] || '').trim().toLowerCase() : '';
    var kg = iKg >= 0 && row[iKg] !== '' ? parseFloat(row[iKg]) : (iLb >= 0 && row[iLb] !== '' ? parseFloat(row[iLb]) * 0.45359237 : NaN);
    var reps = parseFloat(row[iR]);
    var km = iKm >= 0 && row[iKm] !== '' ? parseFloat(row[iKm]) : (iMi >= 0 && row[iMi] !== '' ? parseFloat(row[iMi]) * 1.609344 : NaN);
    var secs = iSec >= 0 && row[iSec] !== '' ? parseFloat(row[iSec]) : NaN;
    // keep every set (warm-ups included) so the logger can show them as "previous"
    var exName = iEx >= 0 ? String(row[iEx] || '').trim() : '';

      var ex = w.exMap[exName]; if (!ex){ ex = w.exMap[exName] = { n:exName, sets:[] }; w.exList.push(ex); }
      var set = {};
      if (type === 'warmup') set.t = 'w'; else if (type === 'dropset') set.t = 'd'; else if (type === 'failure') set.t = 'f';
      if (isFinite(kg)) set.w = Math.round(kg * 100) / 100;
      if (isFinite(reps)) set.r = Math.round(reps);
      if (isFinite(km) && km > 0) set.d = Math.round(km * 100) / 100;
      if (isFinite(secs) && secs > 0) set.s = Math.round(secs);
      ex.sets.push(set);

    if (!includeWarmups && type === 'warmup') continue;
    var et = exName ? exType(exName) : 'wr', body = exName ? bodyFor(exName, et, w.date) : 0;
    if (body > 0) w.volume += setVolume({ w:kg, r:reps }, et, body);
    else if (kg > 0 && reps > 0) w.volume += kg * reps;
    w.sets++;

  var out = []; map.forEach(function(w){ w.volume = Math.round(w.volume); w.exercises = w.exList; delete w.exList; delete w.exMap; out.push(w); });
  out.sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  return { workouts: out, bad: bad };
}

  var exp = Date.now() + 3600*1000;

  var via = photoVia();
  if (via === 'sb'){
    var base = Acc.user.id + '/' + ciId + '/' + it.pid, st = sb.storage.from(PH_BUCKET), opts = { contentType:'image/jpeg', upsert:true, cacheControl:'31536000' };
    var r1 = await st.upload(base + '.jpg', it.full, opts);
    if (r1 && r1.error) throw r1.error;
    var r2 = await st.upload(base + '_t.jpg', it.thumb, opts);
    if (r2 && r2.error){ st.remove([base + '.jpg']).catch(noop); throw r2.error; }
    PH.urls['sb:' + base + '.jpg'] = { url:it.fullUrl, exp:0 }; PH.urls['sb:' + base + '_t.jpg'] = { url:it.thumbUrl, exp:0 };
    return { id:it.pid, via:'sb', full:base + '.jpg', thumb:base + '_t.jpg', w:it.w, h:it.h };
  }
  if (via === 'asset'){
    var a = await photoAssets();
    if (!a) throw { code:'not_granted' };
    var f = await a.upload(it.full, { type:'image/jpeg' }), t;
    try { t = await a.upload(it.thumb, { type:'image/jpeg' }); } catch(e){ a.delete(f.id).catch(noop); throw e; }
    PH.urls['asset:' + f.id] = { url:it.fullUrl, exp:0 }; PH.urls['asset:' + t.id] = { url:it.thumbUrl, exp:0 };
    return { id:it.pid, via:'asset', full:f.id, thumb:t.id, w:it.w, h:it.h };
  }
  throw { code:'no_storage' };
}
async function removePhotos(list){
  var paths = [], ids = [];
  (list || []).forEach(function(p){
    if (!p) return;
    if (p.via === 'sb') paths.push(p.full, p.thumb); else if (p.via === 'asset') ids.push(p.full, p.thumb);
  });
  if (paths.length && Store.mode === 'account' && sb && sb.storage){ try { await sb.storage.from(PH_BUCKET).remove(paths); } catch(e){} }
  if (ids.length && Store.mode === 'cloud'){
    var a = await photoAssets();
    if (a) for (var i = 0; i < ids.length; i++){ try { await a.delete(ids[i]); } catch(e){} }
  }
}
function photoErrMsg(e){
  var code = e && (e.code || e.error), msg = String((e && (e.message || e.statusCode)) || '').toLowerCase();
  if (offlineNow()) return 'You’re offline. Photos need a connection to upload — try again when you’re back online, or remove them to save the rest now.';
  if (code === 'too_large' || msg.indexOf('413') >= 0 || msg.indexOf('too large') >= 0 || msg.indexOf('exceeded the maximum') >= 0) return 'That photo is too big to upload.';
  if (code === 'quota_or_state' || msg.indexOf('quota') >= 0) return 'Photo storage is full, so the photos weren’t saved.';
  if (code === 'rate_limited') return 'Too many uploads at once — wait a moment and try again.';
  if (code === 'not_granted' || code === 'no_storage' || code === 'capability_disabled') return 'Photos can’t be saved here right now. Remove them to save the rest of your check-in.';
  if (msg.indexOf('row-level security') >= 0 || msg.indexOf('jwt') >= 0 || msg.indexOf('unauthorized') >= 0) return 'Your login has expired — log out and back in, then try again.';
  return 'Couldn’t upload the photos — check your connection and try again.';
}

/* ---------- weight: a check-in weight is also a weigh-in, so it shows on the chart ---------- */
function syncCheckinWeight(c, kg){
  var w = c.weightId ? findEntry('weights', c.weightId) : null;
  if (w && w.date !== c.date && w.src !== 'checkin') w = null;                 // never move a weigh-in logged by hand
  if (!w) w = last(state.weights.filter(function(x){ return x.date === c.date; })) || null;
  if (kg == null){
    if (w && w.src === 'checkin' && w.id === c.weightId) state.weights = state.weights.filter(function(x){ return x !== w; });
    delete c.weightId;
    return;
  }
  if (w){ w.kg = kg; w.date = c.date; }
  else { w = { id:uid(), date:c.date, kg:kg, note:'Weekly check-in', src:'checkin', ts:Date.now() }; state.weights.push(w); }
  c.weightId = w.id;
  sortList('weights');
}

/* ---------- logging / editing a check-in ---------- */
function checkinSheet(c, forDate){
  var tn = tnum(), today = todayStr(), lw = last(state.weights);
  var newest = sundayOnOrBefore(tn), choices = [];
  for (var i = 0; i < 12; i++){ var d = dstr(newest - 7*i); if (!checkinOn(d, c && c.id)) choices.push(d); }
  if (c && choices.indexOf(c.date) < 0) choices.unshift(c.date);
  if (!choices.length){ toast('You’ve checked in every Sunday for the last 12 weeks'); return; }
  var date = c ? c.date : (forDate && choices.indexOf(forDate) >= 0 ? forDate : choices[0]);
  var same = c ? null : last(state.weights.filter(function(x){ return x.date === date; }));
  var kgVal = c ? ciKg(c) : (same ? same.kg : null);
  var items = ciPhotos(c).map(function(p){ return { saved:p }; }), removed = [], busy = false, avail = null;
  var opts = choices.map(function(d){ return '<option value="' + d + '"' + (d === date ? ' selected' : '') + '>' + (d === today ? 'Today, ' : '') + esc(fmtD(d, { dow:true, year: d.slice(0,4) !== today.slice(0,4) })) + '</option>'; }).join('');
  var body = '<form novalidate>' +
    field('Sunday', '<select name="date">' + opts + '</select>') +
    field('Weight (kg)', '<input name="kg" inputmode="decimal" autocomplete="off" placeholder="' + (lw ? f1(lw.kg) : 'e.g. 84.6') + '" value="' + (kgVal != null ? esc(String(kgVal)) : '') + '">', 'Optional. It’s added to your weigh-ins too.') +
    field('How did the week go?', '<textarea class="plain" name="summary" rows="4" maxlength="2000" placeholder="Wins, struggles, energy, sleep, anything worth remembering…">' + esc(c && c.summary || '') + '</textarea>', 'Optional.') +
    '<div class="field"><span>Progress photos</span><div class="ci-photos" data-grid></div><div class="hint" data-phnote>Up to ' + CI_MAX + '.</div></div>' +
    '<div class="err"></div><button class="btn primary block" type="submit">' + (c ? 'Save changes' : 'Save check-in') + '</button>' +
    (c ? '<div class="md-gap"><button class="btn block danger" type="button" data-del>Delete check-in</button></div>' : '') + '</form>';
  openSheet(c ? 'Edit check-in' : 'Weekly check-in', body, function(sh){
    var f = $('form', sh), grid = $('[data-grid]', sh), note = $('[data-phnote]', sh), btn = $('button[type=submit]', sh);
    function drawGrid(){
      var h = items.map(function(it, i){
        var img = it.saved ? photoTag(it.saved, 'thumb') : it.pend ? '<img src="' + it.pend.thumbUrl + '" alt="">' : '';
        return '<div class="ci-tile' + (it.busy ? ' busy' : '') + '"><span class="ph">' + img + '</span>' +
               (it.busy ? '<span class="ci-spin"><span class="spin"></span></span>' : '<button type="button" class="ci-x" data-rm="' + i + '" aria-label="Remove photo ' + (i+1) + '">×</button>') + '</div>';
      }).join('');
      if (items.length < CI_MAX) h += '<label class="ci-add' + (avail === false ? ' off' : '') + '">' + CAMERA + '<span>Add photo' + (CI_MAX - items.length > 1 ? 's' : '') + '</span><small>' + items.length + ' of ' + CI_MAX + '</small>' +
        '<input class="sr" type="file" accept="image/*" multiple data-file' + (avail === false ? ' disabled' : '') + '></label>';
      grid.innerHTML = h;
      hydratePhotos(grid);
      var fi = $('[data-file]', grid); if (fi) fi.addEventListener('change', onPick);
      $all('[data-rm]', grid).forEach(function(b){ b.addEventListener('click', function(){
        if (busy) return;
        var it = items.splice(+b.getAttribute('data-rm'), 1)[0];
        if (it && it.saved) removed.push(it.saved);
        drawGrid();
      }); });
    }
    async function onPick(ev){
      var files = Array.prototype.slice.call(ev.target.files || []), room = CI_MAX - items.length;
      ev.target.value = '';
      if (!files.length) return;
      formErr(sh, '');
      if (files.length > room) toast('Only ' + CI_MAX + ' photos per check-in — added the first ' + room);
      var batch = files.slice(0, room).map(function(file){ return { busy:true, file:file }; });
      items = items.concat(batch); drawGrid();
      for (var k = 0; k < batch.length; k++){
        var it = batch[k];
        try { it.pend = await preparePhoto(it.file); it.busy = false; }
        catch(e){ items = items.filter(function(x){ return x !== it; }); formErr(sh, 'One photo couldn’t be read. Try a JPEG or PNG, or a screenshot of it.'); }
        delete it.file;
        drawGrid();
      }
    }
    drawGrid();
    if (!c){
      var kgTouched = false;
      f.kg.addEventListener('input', function(){ kgTouched = true; });
      f.date.addEventListener('change', function(){
        if (kgTouched) return;
        var w = last(state.weights.filter(function(x){ return x.date === f.date.value; }));
        f.kg.value = w ? String(w.kg) : '';
      });
    }
    photosAvailable().then(function(ok){
      avail = ok;
      var mode = photoVia();
      note.textContent = !ok ? (mode === 'asset' ? 'Photos can’t be saved on this page right now — your weight and summary still save.' : 'Photos need your account storage, which isn’t connected right now.')
                       : 'Up to ' + CI_MAX + '. ' + (mode === 'sb' ? 'Only you can see them.' : 'Saved privately with this page.');
      drawGrid();
    });
    f.addEventListener('submit', async function(ev){
      ev.preventDefault();
      if (busy) return;
      formErr(sh, '');
      var d = f.date.value, kgStr = f.kg.value.trim(), kg = kgStr ? parseDec(kgStr) : null, summary = f.summary.value.trim();
      if (!isDate(d) || !isSunday(dnum(d))) return formErr(sh, 'Pick a Sunday.');
      if (kgStr && !(kg >= 25 && kg <= 400)) return formErr(sh, 'Enter your weight in kg, e.g. 84.6 — or leave it blank.');
      if (items.some(function(it){ return it.busy; })) return formErr(sh, 'Hang on — the photos are still being prepared.');
      if (kg == null && !summary && !items.length) return formErr(sh, 'Add a weight, a few words on your week or a photo to save a check-in.');
      if (checkinOn(d, c && c.id)) return formErr(sh, 'There’s already a check-in for that Sunday.');
      var id = c ? c.id : uid(), pend = items.filter(function(it){ return it.pend && !it.saved; });
      if (pend.length){
        if (!(await photosAvailable())) return formErr(sh, photoErrMsg({ code:'no_storage' }));
        busy = true; btn.disabled = true; btn.style.opacity = '.7';
        var done = [];
        try {
          for (var k = 0; k < pend.length; k++){
            btn.textContent = 'Uploading photo ' + (k+1) + ' of ' + pend.length + '…';
            pend[k].saved = await uploadPhoto(id, pend[k].pend);
            done.push(pend[k]);
          }
        } catch(e){
          busy = false; btn.disabled = false; btn.style.opacity = ''; btn.textContent = c ? 'Save changes' : 'Save check-in';
          removePhotos(done.map(function(it){ var s = it.saved; delete it.saved; return s; }));
          return formErr(sh, photoErrMsg(e));
        }
      }
      var entry = { id:id, date:d, summary: summary || undefined, kg: kg == null ? undefined : Math.round(kg*100)/100,
                    photos: items.map(function(it){ return it.saved; }).filter(Boolean), weightId: c ? c.weightId : undefined, ts: c ? c.ts : Date.now() };
      syncCheckinWeight(entry, entry.kg == null ? null : entry.kg);
      var at = -1; state.checkins.forEach(function(x, j){ if (x.id === id) at = j; });
      if (at >= 0) state.checkins[at] = entry; else state.checkins.push(entry);
      sortList('checkins');
      persist(['checkins', 'weights']);
      if (removed.length) removePhotos(removed);
      busy = false; closeSheet(); render(); toast(c ? 'Check-in updated' : 'Check-in saved');
    });
    if (c) confirmButton($('[data-del]', sh), 'Tap again to delete', function(){
      state.checkins = state.checkins.filter(function(x){ return x.id !== c.id; });
      persist(['checkins']);
      removePhotos(ciPhotos(c));
      closeSheet(); render(); toast('Check-in deleted');
    });
  });
}

/* ---------- full-screen photo viewer ---------- */
function openViewer(photos, idx, label){
  if (!photos.length) return;
  var el = document.createElement('div'); el.className = 'pv'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Progress photos');
  el.innerHTML = '<div class="pv-top"><span class="pv-c"></span><button class="icon-btn" data-pv-close aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>' +
    '<div class="pv-stage"></div>' + (photos.length > 1 ? '<button class="pv-nav prev" data-pv-step="-1" aria-label="Previous photo">‹</button><button class="pv-nav next" data-pv-step="1" aria-label="Next photo">›</button>' : '') +
    '<div class="pv-bot">' + esc(label || '') + '</div>';
  document.body.appendChild(el);
  var stage = $('.pv-stage', el), count = $('.pv-c', el);
  function show(i){
    idx = (i + photos.length) % photos.length;
    var p = photos[idx];
    stage.innerHTML = '<span class="ph pv-ph">' + photoTag(p, 'thumb') + '</span>' + photoTag(p, 'full').replace('<img ', '<img class="pv-full" ');
    var full = $('.pv-full', stage); full.addEventListener('load', function(){ full.classList.add('on'); });
    hydratePhotos(stage);
    count.textContent = photos.length > 1 ? (idx + 1) + ' of ' + photos.length : '';
  }
  function close(){ document.removeEventListener('keydown', onKey); el.classList.remove('open'); setTimeout(function(){ el.remove(); }, 200); }
  function onKey(e){ if (e.key === 'Escape') close(); else if (e.key === 'ArrowLeft') show(idx - 1); else if (e.key === 'ArrowRight') show(idx + 1); }
  document.addEventListener('keydown', onKey);
  $('[data-pv-close]', el).addEventListener('click', close);
  $all('[data-pv-step]', el).forEach(function(b){ b.addEventListener('click', function(){ show(idx + +b.getAttribute('data-pv-step')); }); });
  var x0 = null;
  stage.addEventListener('pointerdown', function(e){ x0 = e.clientX; });
  stage.addEventListener('pointerup', function(e){ if (x0 == null) return; var dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 50 && photos.length > 1) show(idx + (dx < 0 ? 1 : -1)); });
  show(idx || 0);
  requestAnimationFrame(function(){ el.classList.add('open'); });
}
