  var done = 0, unticked = 0;
  WK.exercises.forEach(function(x){ x.sets.forEach(function(s){ if (s.done) done++; else if (['w','r','s','d'].some(function(k){ return String(s[k] == null ? '' : s[k]).trim() !== ''; })) unticked++; }); });
  if (!done && !unticked) return toast('Tick off at least one set first, or discard the workout');
  if (!unticked) return saveWorkoutSheet();
  openSheet('Some sets aren’t ticked', '<p>' + unticked + ' set' + (unticked === 1 ? ' has' : 's have') + ' numbers in but ' + (unticked === 1 ? 'isn’t' : 'aren’t') + ' ticked off.</p>' +
    '<button class="btn primary block" data-all>Tick them off and finish</button><div class="md-gap"><button class="btn block" data-drop>Leave them out and finish</button></div>', function(sh){
    $('[data-all]', sh).addEventListener('click', function(){
      WK.exercises.forEach(function(x){ x.sets.forEach(function(s, si){ if (!s.done && !fillFromSuggestion(x, si)) s.done = true; }); });
      closeSheet(); renderLogger(); setTimeout(saveWorkoutSheet, 280);
    });
    $('[data-drop]', sh).addEventListener('click', function(){ closeSheet(); setTimeout(saveWorkoutSheet, 280); });
  });
}
function buildWorkout(){
  var exercises = [], volume = 0, sets = 0, prs = [];
  WK.exercises.forEach(function(x){
    var t = exType(x.n), done = x.sets.filter(function(s){ return s.done; }).map(function(s){ return cleanSet(s, t); });
    if (!done.length) return;
    done.forEach(function(s){ volume += setVolume(s, t); sets++; });
    var ex = { n:x.n, sets:done }; if (x.note && x.note.trim()) ex.note = x.note.trim();
    exercises.push(ex);
    if (t === 'wr' || t === 'wbw'){
      var before = exerciseRecords(x.n, WK.editId);
      if (before.sessions){
        var hw = Math.max.apply(null, done.map(function(s){ return s.w || 0; })), b1 = Math.max.apply(null, done.map(function(s){ return e1rm(s.w || 0, s.r || 0); }));
        if (hw > before.heaviest) prs.push(x.n + ': heaviest weight ' + nf2.format(hw) + ' kg');
        else if (b1 > before.best1rm + 0.05) prs.push(x.n + ': best est. 1RM ' + nf1.format(b1) + ' kg');
      }
    }
  });
  return { exercises:exercises, volume:Math.round(volume), sets:sets, prs:prs };
}
function workoutTitleFor(ms){ var h = new Date(ms || Date.now()).getHours(); return h < 12 ? 'Morning Workout' : h < 17 ? 'Afternoon Workout' : 'Evening Workout'; }
function saveWorkoutSheet(){
  var E = WK.mode === 'edit', w = buildWorkout();
  if (!w.exercises.length) return toast('Tick off at least one set first');
  var mins = E ? (WK.durationMin ? Math.round(WK.durationMin) : '') : Math.max(1, Math.round((Date.now() - WK.startedAt) / 60000));
  var body = '<form>' + field('Title', '<input name="title" autocomplete="off" value="' + esc(WK.title || workoutTitleFor(WK.startedAt)) + '" required>') +
    '<div class="two">' + field('Date', dateInput('date', E ? WK.date : todayStr(), todayStr())) + field('Duration (min)', '<input name="dur" inputmode="numeric" value="' + esc(mins) + '">') + '</div>' +
    field('Description (optional)', '<textarea class="plain" name="desc" placeholder="How did it go?">' + esc(E ? WK.notes || '' : '') + '</textarea>') +
    '<div class="calc"><b>' + f0(w.volume) + ' kg</b> volume · <b>' + w.sets + '</b> set' + (w.sets === 1 ? '' : 's') + ' · <b>' + w.exercises.length + '</b> exercise' + (w.exercises.length === 1 ? '' : 's') +
    (w.prs.length ? '<div class="md-gap pr">🏆 ' + w.prs.length + ' personal record' + (w.prs.length === 1 ? '' : 's') + '</div>' + w.prs.map(function(p){ return '<div class="small">' + esc(p) + '</div>'; }).join('') : '') + '</div>' +
    '<div class="err"></div><button class="btn primary block" type="submit">' + (E ? 'Save changes' : 'Save Workout') + '</button></form>';
  openSheet(E ? 'Save changes' : 'Save workout', body, function(sh){
    var f = $('form', sh);
    f.addEventListener('submit', function(ev){
      ev.preventDefault();
      if (!isDate(f.date.value)) return formErr(sh, 'Pick a date.');
      var dur = f.dur.value.trim() ? parseDec(f.dur.value) : null;
      if (dur != null && !(dur > 0 && dur < 1440)) return formErr(sh, 'Duration should be in minutes.');
      var old = E ? findEntry('lifts', WK.editId) : null;
      var entry = Object.assign({}, old || {}, {
        id: E ? WK.editId : uid(), date:f.date.value, name:f.title.value.trim() || workoutTitleFor(WK.startedAt),
        volume:w.volume, sets:w.sets, durationMin: dur || undefined, notes: f.desc.value.trim() || undefined,
        exercises:w.exercises, startedAt:WK.startedAt || undefined, source: old && old.source ? old.source : 'logger', ts: old ? old.ts : Date.now()
      });
      var prs = w.prs.length;
      closeLogger();
      saveEntry('lifts', entry, (E ? 'Workout updated' : 'Workout saved') + (prs ? ' · 🏆 ' + prs + ' PR' + (prs === 1 ? '' : 's') : ''));
    });
  });
}
function saveRoutine(){
  var name = String(WK.title || '').trim();
  if (!name){ toast('Give the routine a title'); var i = $('#wk .rt-title'); if (i) i.focus(); return; }
  if (!WK.exercises.length) return toast('Add at least one exercise');
  var r = { id: WK.routineId || uid(), name:name, ts:Date.now(), exercises: WK.exercises.map(function(x){
    var t = exType(x.n); return { n:x.n, rest:x.rest, sets: x.sets.map(function(s){ return cleanSet(s, t, true); }) };
  }) };
  var i2 = -1; state.routines.forEach(function(x, k){ if (x.id === r.id) i2 = k; });
  if (i2 >= 0) state.routines[i2] = r; else state.routines.push(r);
  persist(['settings']); closeLogger(); render(); toast('Routine saved');
}
function routineFromWorkout(l){
  var r = { id:uid(), name:l.name || 'Routine', ts:Date.now(), exercises:(l.exercises || []).map(function(x){ return { n:x.n, rest:restFor(x.n), sets:(x.sets || []).map(function(s){ return clone(s); }) }; }) };
  state.routines.push(r); persist(['settings']); render(); toast('Saved as routine “' + r.name + '”');
}

/* ---------- lifting screens: routines, chooser, workout details ---------- */
function liftingTopHtml(){
  var h = '<button class="btn primary block" data-act="startwk" style="margin-bottom:6px">' + ICON.plus + ' Start Empty Workout</button>';
  h += '<div class="row" style="margin:18px 2px 10px"><div class="section-title" style="margin:0">Routines</div><button class="btn ghost" data-act="newroutine">+ New Routine</button></div>';
  if (!state.routines.length) h += '<div class="card small text-2" style="line-height:1.5">Save the sessions you repeat, like Push, Pull and Legs, as routines. Then start them in one tap with last time’s numbers ready.</div>';
  state.routines.forEach(function(r){
    var names = r.exercises.map(function(x){ return x.n; });
    h += '<div class="card routine"><div class="row top"><div style="min-width:0"><div class="t1">' + esc(r.name) + '</div><div class="small muted sm-gap" style="line-height:1.4">' +
      esc(names.slice(0, 3).join(', ') + (names.length > 3 ? ' + ' + (names.length - 3) + ' more' : '')) + '</div></div>' +
      '<button class="icon-btn sm" data-act="routinemenu" data-id="' + esc(r.id) + '" aria-label="Routine options">⋯</button></div>' +
      '<button class="btn primary block md-gap" data-act="startroutine" data-id="' + esc(r.id) + '">Start Routine</button></div>';
  });
  return h + '<div class="section-title">Progress</div>';
}
function routineMenu(id){
  var r = state.routines.filter(function(x){ return x.id === id; })[0]; if (!r) return;
  optionSheet(r.name, [
    { label:'Edit routine', fn:function(){ openRoutineEditor(r); } },
    { label:'Duplicate routine', fn:function(){ var c = clone(r); c.id = uid(); c.name = r.name + ' (copy)'; state.routines.push(c); persist(['settings']); render(); toast('Routine duplicated'); } },
    { label:'Delete routine', danger:true, fn:function(){ state.routines = state.routines.filter(function(x){ return x.id !== id; }); persist(['settings']); render(); toast('Routine deleted'); } }
  ]);
}
function liftChooser(){
  var h = '<button class="btn primary block" data-start>' + ICON.plus + ' Start Empty Workout</button>';
  if (state.routines.length) h += '<div class="label" style="margin:18px 0 8px">Start a routine</div><div class="opt-list">' + state.routines.map(function(r){ return '<button class="btn" data-r="' + esc(r.id) + '">' + esc(r.name) + '</button>'; }).join('') + '</div>';
  h += '<hr><div class="opt-list"><button class="btn" data-past>Log a past session (total volume only)</button><button class="btn" data-hevy>Import from Hevy</button></div>';
  openSheet('Lifting', h, function(sh){
    $('[data-start]', sh).addEventListener('click', function(){ closeSheet(); setTimeout(startEmptyWorkout, 250); });
    $all('[data-r]', sh).forEach(function(b){ b.addEventListener('click', function(){ closeSheet(); setTimeout(function(){ startRoutine(b.getAttribute('data-r')); }, 250); }); });
    $('[data-past]', sh).addEventListener('click', function(){ closeSheet(); setTimeout(function(){ liftSheet(); }, 280); });
    $('[data-hevy]', sh).addEventListener('click', function(){ closeSheet(); setTimeout(hevySheet, 280); });
  });
}
function timeStr(ms){ var d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function workoutDetailSheet(l){
  var h = '<div class="small muted">' + esc(relDay(l.date)) + (l.startedAt ? ' · ' + timeStr(l.startedAt) : '') + (l.source === 'hevy' ? ' · imported from Hevy' : '') + '</div>';
  h += '<div class="stats" style="margin-top:12px">' + stat('Duration', l.durationMin ? Math.round(l.durationMin) + ' min' : '—') + stat('Volume', f0(l.volume || 0) + ' kg') + stat('Sets', String(l.sets || 0)) + '</div>';
  if (l.notes) h += '<p>' + esc(l.notes) + '</p>';
  (l.exercises || []).forEach(function(x){
    var t = exType(x.n), lab = setLabelFn();
    h += '<div class="wd-ex"><button class="exc-name" data-exinfo="' + esc(x.n) + '"><span class="ava">' + esc(avatarText(x.n)) + '</span><span>' + esc(x.n) + '</span></button>' +
      (x.note ? '<div class="small muted" style="margin:6px 0 2px">' + esc(x.note) + '</div>' : '') + '<div style="margin-top:6px">' +
      (x.sets || []).map(function(s){ return '<div class="wd-set"><span class="set-no ' + (s.t || '') + '">' + lab(s) + '</span><span>' + esc(fmtSet(s, t)) + '</span></div>'; }).join('') + '</div></div>';
  });
  h += '<div class="btn-row md-gap"><button class="btn" data-edit>Edit Workout</button><button class="btn" data-routine>Save as Routine</button></div><button class="btn block danger" data-del>Delete Workout</button>';
  openSheet(l.name || 'Workout', h, function(sh){
    $all('[data-exinfo]', sh).forEach(function(b){ b.addEventListener('click', function(){ exerciseInfoSheet(b.getAttribute('data-exinfo')); }); });
    $('[data-edit]', sh).addEventListener('click', function(){ closeSheet(); setTimeout(function(){ editWorkout(l); }, 250); });
    $('[data-routine]', sh).addEventListener('click', function(){ closeSheet(); routineFromWorkout(l); });
    confirmButton($('[data-del]', sh), 'Tap again to delete', function(){ deleteEntry('lifts', l.id); });
  });
}

/* =========================================================
   Events & navigation
   ========================================================= */
function scrollToTop(){ var sc = $('#scroll'); if (sc) sc.scrollTop = 0; }
function editing(){ var a = document.activeElement; return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); }
function resetPageShift(){ if (!editing() && (window.scrollY || document.documentElement.scrollTop || document.body.scrollTop)){ window.scrollTo(0, 0); document.body.scrollTop = 0; } }
document.addEventListener('focusout', function(){ setTimeout(resetPageShift, 60); });
window.addEventListener('scroll', resetPageShift, { passive:true });
if (window.visualViewport) window.visualViewport.addEventListener('resize', function(){ setTimeout(resetPageShift, 60); });
function go(view){
  if (VIEWS.indexOf(view) < 0) view = 'overview';
  var changed = ui.view !== view;
  ui.view = view;
  try { if (location.hash.slice(1) !== view) location.hash = view; } catch(e){}
  render();
  if (changed) scrollToTop();
}
document.addEventListener('click', function(ev){
  var t = ev.target.closest('[data-go],[data-act]');
  if (!t || t.closest('#sheetRoot')) return;
  if (t.hasAttribute('data-go')) return go(t.getAttribute('data-go'));
  var act = t.getAttribute('data-act'), kind = t.getAttribute('data-kind');
  if (act === 'settings') return settingsSheet();
  if (act === 'hevy') return hevySheet();
  if (act === 'startwk') return startEmptyWorkout();
  if (act === 'resumewk') return openLogger();
  if (act === 'newroutine') return openRoutineEditor(null);
  if (act === 'startroutine') return startRoutine(t.getAttribute('data-id'));
  if (act === 'routinemenu') return routineMenu(t.getAttribute('data-id'));
  if (act === 'add' && kind === 'lift') return liftChooser();
  if (act === 'add' && kind === 'liftpast') return liftSheet();
  if (act === 'add'){
    if (kind === 'weight') return weightSheet();
    if (kind === 'lift') return liftSheet();
    if (kind === 'run') return runSheet();
    if (kind === 'steps') return stepsSheet();
  }
  if (act === 'goal') return kind === 'weight' ? weightGoalSheet() : weeklyGoalSheet(kind);
  if (act === 'range'){ ui.ranges[t.getAttribute('data-key')] = t.getAttribute('data-val'); return render(); }
  if (act === 'more'){ ui.showAll[t.getAttribute('data-list')] = true; return render(); }
  if (act === 'edit'){
    var list = t.getAttribute('data-list'), e = findEntry(list, t.getAttribute('data-id'));
    if (!e) return;
    if (list === 'weights') return weightSheet(e);
    if (list === 'lifts') return e.exercises && e.exercises.length ? workoutDetailSheet(e) : liftSheet(e);
    if (list === 'runs') return runSheet(e);
    if (list === 'steps') return stepsSheet(e);
  }
});
window.addEventListener('hashchange', function(){ var h = location.hash.slice(1); if (h && h !== ui.view && VIEWS.indexOf(h) >= 0){ ui.view = h; render(); } });
var resizeT = null, lastW = window.innerWidth;
window.addEventListener('resize', function(){ clearTimeout(resizeT); resizeT = setTimeout(function(){ if (window.innerWidth !== lastW){ lastW = window.innerWidth; mountCharts(); } }, 150); });
// re-render when the day rolls over while the app stays open
var lastDay = todayStr();
document.addEventListener('visibilitychange', function(){ if (!document.hidden && todayStr() !== lastDay){ lastDay = todayStr(); render(); } });

/* =========================================================
   Boot
   ========================================================= */
async function boot(){
  var h = location.hash.slice(1);
  if (VIEWS.indexOf(h) >= 0) ui.view = h;
  var cloud = false;
  if (BUILD !== 'pwa'){ try { cloud = await initCloud(); } catch(e){ cloud = false; } }
  if (accountsEnabled()){
    sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {
      auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:'healthhub.auth' }
    });
    sb.auth.onAuthStateChange(function(ev, session){
      // keep this callback synchronous: Supabase calls are deferred with setTimeout
      if (ev === 'PASSWORD_RECOVERY') setTimeout(newPasswordSheet, 400);
      if (ev === 'SIGNED_OUT' && Acc.user) setTimeout(function(){ logout(true); }, 0);
      if (ev === 'USER_UPDATED' && session && Acc.user){ Store.name = displayName(session.user) || Store.name; setTimeout(render, 0); }
    });
    var session = null;
    try { session = (await sb.auth.getSession()).data.session; } catch(e){ session = null; }
    if (session && session.user) startUser(session.user); else showAuth('login');
  } else {
    if (!cloud) loadLocal();
    render();
    wkRestore();
  }
  var ld = $('#loader'); if (ld){ ld.style.transition = 'opacity .25s'; ld.style.opacity = '0'; setTimeout(function(){ ld.remove(); }, 260); }
  if (BUILD === 'pwa' && 'serviceWorker' in navigator){ try { navigator.serviceWorker.register('sw.js').catch(function(){}); } catch(e){} }
}
window.__hh = { get state(){ return state; }, parseHevy:parseHevy, parseLooseDateTime:parseLooseDateTime, weekStatus:weekStatus, weightStatus:weightStatus, rampAt:rampAt, Store:Store, render:render };
boot();
})();
</script>
